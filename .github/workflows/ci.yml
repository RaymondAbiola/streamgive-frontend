name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match the npm major that generated package-lock.json (npm 11,
          # which ships with Node 24). npm 10 resolves a slightly different
          # tree for some transitive peer deps, so `npm ci` under Node 22
          # rejects this lockfile as missing entries.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (navigation only — no wallet extension in CI)
        run: npx playwright test e2e/donor-flow.spec.ts
